<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
<title id="title">Chetan Khandelwal — animated ocean technology footer</title>
<desc id="desc">A futuristic sunset ocean with an animated ship, flying technology birds, jumping fish and technology labels.</desc>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#020617"/><stop offset=".52" stop-color="#0c4a6e"/><stop offset="1" stop-color="#f97316"/></linearGradient>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#075985"/><stop offset="1" stop-color="#020617"/></linearGradient>
<radialGradient id="sun"><stop stop-color="#fff7ed"/><stop offset=".45" stop-color="#fbbf24"/><stop offset="1" stop-color="#f97316" stop-opacity=".1"/></radialGradient>
<filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>.skill{font:800 15px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#cffafe;letter-spacing:1px}.tiny{font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#a5f3fc}</style>
</defs>
<!-- sunset sky -->
<rect width="1600" height="520" fill="url(#sky)"/>
<circle cx="1120" cy="190" r="92" fill="url(#sun)" filter="url(#glow)"/>
<!-- sunset rays -->
<g stroke="#fed7aa" opacity=".18"><path d="M1120 190L820 60M1120 190L960 35M1120 190L1260 35M1120 190L1450 80"/></g>
<!-- distant mountains -->
<path d="M0 310L180 230 300 305 455 210 590 305 750 225 900 310 1040 215 1190 305 1370 225 1600 305V360H0Z" fill="#082f49" opacity=".8"/>
<!-- sea -->
<path d="M0 310 Q120 285 240 310 T480 310 T720 310 T960 310 T1200 310 T1440 310 T1680 310 V520H0Z" fill="url(#sea)"/>
<!-- animated waves -->
<g fill="none" stroke="#38bdf8" stroke-linecap="round">
<path d="M0 340 Q100 315 200 340 T400 340 T600 340 T800 340 T1000 340 T1200 340 T1400 340 T1600 340" stroke-width="5" opacity=".5">
<animate attributeName="d" dur="4s" repeatCount="indefinite" values="M0 340 Q100 315 200 340 T400 340 T600 340 T800 340 T1000 340 T1200 340 T1400 340 T1600 340;M0 340 Q100 350 200 340 T400 330 T600 340 T800 350 T1000 340 T1200 330 T1400 340 T1600 350;M0 340 Q100 315 200 340 T400 340 T600 340 T800 340 T1000 340 T1200 340 T1400 340 T1600 340"/>
</path>
<path d="M0 405 Q140 380 280 405 T560 405 T840 405 T1120 405 T1400 405 T1680 405" stroke-width="3" opacity=".45">
<animate attributeName="transform" values="translate(-30 0);translate(30 0);translate(-30 0)" dur="5s" repeatCount="indefinite"/>
</path></g>
<!-- ship -->
<g transform="translate(470 325)">
<path d="M0 0L190 0 155 58 35 58Z" fill="#020617" stroke="#67e8f9" stroke-width="3"/>
<path d="M72 0V-105L145 0Z" fill="#0e7490" stroke="#67e8f9" stroke-width="2"/>
<path d="M75 -92L132 -12" stroke="#e0f2fe" stroke-width="3"/>
<text x="105" y="34" text-anchor="middle" class="tiny">.NET • AZURE • AI</text>
<circle cx="48" cy="25" r="3" fill="#22d3ee"/><circle cx="164" cy="25" r="3" fill="#22d3ee"/>
<animateTransform attributeName="transform" type="translate" values="470 325;500 318;470 325" dur="4s" repeatCount="indefinite"/>
</g>
<!-- skill birds -->
<g fill="none" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round">
<path d="M280 155q12-12 24 0q12-12 24 0"><animateTransform attributeName="transform" type="translate" values="0 0;120 -25;240 0;360 -15;500 -5" dur="9s" repeatCount="indefinite"/></path>
<path d="M760 105q10-10 20 0q10-10 20 0"><animateTransform attributeName="transform" type="translate" values="0 0;110 20;230 -15;360 5" dur="7s" repeatCount="indefinite"/></path>
</g>
<g class="skill" text-anchor="middle">
<text x="280" y="135">C#</text><text x="800" y="85">ANGULAR</text><text x="1320" y="145">AZURE</text>
<text x="160" y="385">SPEC KIT</text><text x="1360" y="395">AGENTIC AI</text>
</g>
<!-- fish jumping -->
<g fill="none" stroke="#67e8f9" stroke-width="3">
<path d="M0 0q18-18 36 0q-18 18-36 0l-14-10m14 10-14 10" transform="translate(920 400)">
<animateTransform attributeName="transform" type="translate" values="920 400;940 315;960 400;980 430" dur="3.6s" repeatCount="indefinite"/></path>
<path d="M0 0q16-16 32 0q-16 16-32 0l-12-9m12 9-12 9" transform="translate(1190 410)">
<animateTransform attributeName="transform" type="translate" values="1190 410;1210 335;1230 410;1250 430" dur="4.3s" begin="1s" repeatCount="indefinite"/></path>
</g>
<!-- technology bubbles -->
<g class="tiny">
<text x="880" y="445">MICROSERVICES</text><text x="1060" y="485">CUSTOM AGENTS</text><text x="650" y="470">SDD</text><text x="1420" y="465">WEB API</text>
</g>
<!-- footer signature -->
<text x="800" y="510" text-anchor="middle" class="skill">BUILD • ARCHITECT • AUTOMATE • EVOLVE</text>
</svg>